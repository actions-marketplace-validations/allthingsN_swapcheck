name: npm cleanup (one time)

# Removes the placeholder 0.0.0-stage and the superseded 0.1.0 from npm, inside npm's 72-hour unpublish window.
# It runs from a vcleanup-npm-* tag so it can use the release environment, which needs a maintainer's approval.
# Delete this file and the tag once it has run.
on:
  push:
    tags:
      - "vcleanup-npm-*"

permissions: {}

jobs:
  unpublish:
    runs-on: ubuntu-24.04
    environment: release
    permissions: {}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install --global --ignore-scripts npm@11.6.2
      - name: Unpublish 0.0.0-stage and 0.1.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm unpublish "@allthingsai/swapcheck@0.0.0-stage"
          npm unpublish "@allthingsai/swapcheck@0.1.0"
      - run: npm view @allthingsai/swapcheck versions dist-tags --json
